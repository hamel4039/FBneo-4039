name: Build FBNeo 4039 Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 4039 patch repository
        uses: actions/checkout@v4
        with:
          path: patch

      - name: Checkout upstream Libretro FBNeo
        uses: actions/checkout@v4
        with:
          repository: libretro/FBNeo
          path: upstream

      - name: Apply FBNeo 4039 overlay
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p upstream/src/burn/drv/capcom

          cp patch/overlay/src/burn/drv/capcom/cps2_4039.cpp \
             upstream/src/burn/drv/capcom/cps2_4039.cpp

          cp patch/overlay/src/burn/drv/capcom/cps2_4039.h \
             upstream/src/burn/drv/capcom/cps2_4039.h

          cp patch/overlay/src/burn/drv/capcom/cps_draw.cpp \
             upstream/src/burn/drv/capcom/cps_draw.cpp

          cp patch/overlay/src/burn/drv/capcom/cps_run.cpp \
             upstream/src/burn/drv/capcom/cps_run.cpp

          cp patch/overlay/src/burn/drv/capcom/meson.build \
             upstream/src/burn/drv/capcom/meson.build

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make file

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27d
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.3.13750724"

      - name: Build Libretro core for Android ARM64
        shell: bash
        working-directory: upstream/src/burner/libretro
        run: |
          set -euxo pipefail

          export NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"

          make clean || true

          make -j2 \
            platform=unix \
            HAVE_NEON=1 \
            USE_CYCLONE=0 \
            PLATFORM_DEFINES='-DANDROID' \
            CFLAGS='-march=armv8-a -Wno-incompatible-function-pointer-types' \
            CXXFLAGS='-march=armv8-a'

          test -f fbneo_libretro.so

          file fbneo_libretro.so

          readelf -h fbneo_libretro.so | grep -E 'Class:|Machine:'

      - name: Upload ARM64 core
        uses: actions/upload-artifact@v4
        with:
          name: FBNeo-4039-Android-ARM64
          path: upstream/src/burner/libretro/fbneo_libretro.so
